name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ParallelPixels.sln
      - run: dotnet build ParallelPixels.sln --configuration Release --no-restore
      - run: dotnet test ParallelPixels.sln --configuration Release --no-build
